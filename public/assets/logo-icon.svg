<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mtsLogoTitle">
  <title id="mtsLogoTitle">Mindful Tech Solutions</title>
  <defs>
    <linearGradient id="mtsGradient" x1="14" y1="14" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Open ring: an enso, drawn with one intentional gap -->
  <path d="M64.37 19.19 A34 34 0 1 1 35.63 19.19" fill="none" stroke="url(#mtsGradient)" stroke-width="6" stroke-linecap="round"/>

  <!-- Five-node "M": brand initial rendered as a small AI network -->
  <polyline points="34,64 34,38 50,52 66,38 66,64" fill="none" stroke="url(#mtsGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34" cy="64" r="4.4" fill="url(#mtsGradient)"/>
  <circle cx="34" cy="38" r="4.4" fill="url(#mtsGradient)"/>
  <circle cx="50" cy="52" r="4.4" fill="url(#mtsGradient)"/>
  <circle cx="66" cy="38" r="4.4" fill="url(#mtsGradient)"/>
  <circle cx="66" cy="64" r="4.4" fill="url(#mtsGradient)"/>
</svg>
